<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Basic EPUB Reader</title>
<link rel="stylesheet" href="style.css">
<script src="lib/jszip.min.js"></script>
<script src="lib/epub.min.js"></script>
<!-- sample-book.js is GENERATED by build.sh (the starter book, base64).
     Absent in a raw source checkout — the app simply starts empty. -->
<script src="sample-book.js"></script>
</head>
<body>

<!-- ============================ BOOKSHELF ============================ -->
<div id="shelfView">
  <div class="topbar">
    <div class="tb-title">Basic EPUB Reader</div>
    <div class="tb-ver">Version 0.1.3</div>
  </div>
  <!-- Shelf tools (v0.1.2): folder import (Joshua, 2026-10-28 —
       pick ONE folder, every EPUB inside it is added), a re-scan
       of remembered folders, and the update channel's manual check.
       The + button still adds individual books. -->
  <div class="shelf-tools">
    <button id="addFolderBtn" class="toolbtn">Add folder</button>
    <button id="refreshFoldersBtn" class="toolbtn">Refresh folders</button>
    <button id="updateBtn" class="toolbtn">Check for updates</button>
  </div>
  <div id="shelfScroll">
    <div id="shelf"></div>
    <div id="shelfEmpty" class="hidden">
      <p>Your shelf is empty.</p>
      <p>Tap <b>+</b> to add an EPUB — from this phone or from Google Drive —
         or use <b>Add folder</b> to bring in a whole folder of books at once.</p>
    </div>
    <div class="shelf-foot">Long-press a book to remove it from the shelf.</div>
    <div class="shelf-foot" id="verLine">Reader 0.1.3</div>
  </div>
  <button id="addBtn" title="Add a book">+</button>
  <input type="file" id="fileInput" accept=".epub,application/epub+zip" multiple hidden>
</div>

<!-- ============================ READER ============================ -->
<!-- Joshua's gesture chrome (2026-10-28): NO footer, NO font-size
     buttons (pinch replaces them), NO title header by default.
     The slim chrome carries only what no gesture replaces: the
     Back-to-shelf button, a progress bar + percentage, and a Stop
     chip that appears only while read-aloud is speaking. The
     title line exists only in the title-on variant (body.title-on:
     slim title above the progress bar), pending Joshua's ruling.
     In full screen even this chrome hides — the page is everything. -->
<div id="readerView" class="hidden">
  <div id="readerChrome">
    <button id="backBtn" class="barbtn">&#8592; Shelf</button>
    <div id="chromeMain">
      <div id="titleLine">
        <div id="readerTitle"></div>
        <div id="chapterLabel"></div>
      </div>
      <div id="progressRow">
        <div id="progressBar"><i id="progressFill"></i></div>
        <div id="progressPct">…</div>
      </div>
    </div>
    <button id="ttsStopBtn" class="barbtn hidden">&#128266; Stop</button>
  </div>
  <div id="viewerWrap">
    <div id="viewer"></div>
    <div id="tapLeft" class="tapzone"></div>
    <div id="tapRight" class="tapzone"></div>
  </div>
</div>

<!-- ====================== FOOTNOTE POP-UP ====================== -->
<div id="footnoteCard" class="hidden">
  <div id="footnoteText"></div>
  <div id="footnoteHint">Tap anywhere to close</div>
</div>

<!-- ================= FOLDER IMPORT PROGRESS ================== -->
<div id="importOverlay" class="hidden">
  <div id="importTitle">Adding books…</div>
  <div id="importBar"><i id="importFill"></i></div>
  <div id="importText"></div>
  <button id="importOk" class="barbtn hidden">OK</button>
</div>

<div id="toast" class="hidden"></div>

<script src="app.js"></script>
<!-- Sync client (v0.1.3): reading places travel through the Epub
     folder file and, paired once, directly with the laptop —
     SYNC-SPEC §5/§6. Also adds the shelf's Sync screen. -->
<script src="sync-client.js"></script>
</body>
</html>
